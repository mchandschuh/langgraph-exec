  intent:
    summary: "Define the deterministic unit-test strategy for WI-0001: Deliver a
      minimal, locally runnable langgraph-exec release that executes one
      parameterized LLM node from YAML through the existing llm package
      boundary."
    inputs:
      - id: INPUT-PHASE
        kind: constraint
        ref: "#constraint/PHASE"
        purpose: The phase contract and release boundary.
        required: true
    requirements:
      - id: REQ-001
        kind: requirement
        statement: "Define the deterministic unit-test strategy for WI-0001: Deliver a
          minimal, locally runnable langgraph-exec release that executes one
          parameterized LLM node from YAML through the existing llm package
          boundary."
        inputRefs:
          - INPUT-PHASE
        required: true
    invariants:
      - id: INV-001
        statement: Tests remain deterministic and do not require live providers.
        inputRefs:
          - INPUT-PHASE
        required: true
    objectives:
      - id: OBJ-001
        statement: "Define the deterministic unit-test strategy for WI-0001: Deliver a
          minimal, locally runnable langgraph-exec release that executes one
          parameterized LLM node from YAML through the existing llm package
          boundary."
        inputRefs:
          - INPUT-PHASE
        requirementRefs:
          - REQ-001
        invariantRefs:
          - INV-001
    nonGoals:
      - Do not claim provider or production behavior from local unit tests.
  result:
    status: defined
    testCases:
      - id: TC-001
        title: Parse a valid closed direct-node YAML document
        type: unit
        requirementLevel: required
        purpose: Prove that the phase-one artifact exposes its implementation, parameters, ports, and bindings without graph topology.
        procedure:
          executionMode: executable
          target: YAML node parser
          steps:
            - Load the valid YAML fixture.
            - Parse and validate the closed node contract.
            - Assert the registered llm.complete implementation and declared ports are present.
          command: yarn test
        expectedOutcome: The fixture parses to a normalized direct node with no graph fields.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-VALID-NODE
        limitations:
          - This check does not prove provider behavior.
      - id: TC-002
        title: Reject malformed or unknown YAML fields before execution
        type: unit
        requirementLevel: required
        purpose: Prove the closed validation boundary and no-provider behavior for invalid artifacts.
        procedure:
          executionMode: executable
          target: YAML node parser
          steps:
            - Load malformed and unknown-field fixtures.
            - Assert a bounded validation error.
            - Assert the fake completion service was not called.
          command: yarn test
        expectedOutcome: Invalid definitions fail deterministically before service invocation.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-INVALID-YAML
          - FIX-UNKNOWN-FIELD
        limitations:
          - This check does not prove behavior against an external provider.
      - id: TC-003
        title: Resolve parameter defaults, overrides, and input mappings
        type: unit
        requirementLevel: required
        purpose: Prove typed parameter resolution and runtime input bindings.
        procedure:
          executionMode: executable
          target: Direct node resolver
          steps:
            - Execute a node with no override and assert defaults.
            - Execute the same node with parameter and input overrides.
            - Capture the constructed request.
          command: yarn test
        expectedOutcome: Defaults apply predictably and explicit values override them with type validation.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-VALID-NODE
        limitations:
          - This check does not prove provider behavior.
      - id: TC-004
        title: Capture the final llm request and map the closed response
        type: unit
        requirementLevel: required
        purpose: Prove the injected llm/request/v1 boundary without network activity.
        procedure:
          executionMode: executable
          target: Direct node executor with fake completion service
          steps:
            - Inject a fake service that records the request and returns a success envelope.
            - Execute the node.
            - Assert request fields, response envelope, and bounded provider-error handling.
          command: yarn test
        expectedOutcome: The fake service receives the final request and the node returns the service envelope unchanged.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-VALID-NODE
        limitations:
          - This check does not prove authenticated provider availability.
      - id: TC-005
        title: Exercise provider-free CLI validation and inspection
        type: unit
        requirementLevel: required
        purpose: Prove stable CLI help, version, validation, inspection, and invalid-input exit behavior.
        procedure:
          executionMode: executable
          target: CLI command boundary
          steps:
            - Invoke help and version.
            - Invoke validate and inspect against the valid fixture.
            - Invoke validate against an invalid fixture and assert a nonzero result.
          command: yarn test
        expectedOutcome: Offline commands succeed or fail deterministically without initializing a provider.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-VALID-NODE
          - FIX-INVALID-YAML
        limitations:
          - "This check does not prove provider availability or production readiness."
    fixtures:
      - id: FIX-VALID-NODE
        name: valid-direct-node
        purpose: Provide a complete phase-one llm.complete node with defaults and bindings.
        setup: Load a repository-local YAML fixture with a parameterized task and system prompt.
        teardown: No external state is created.
        sourceRefs:
          - "#artifact/FIXTURE-VALID-NODE"
      - id: FIX-INVALID-YAML
        name: invalid-yaml
        purpose: Provide malformed YAML for the negative path.
        setup: Load a fixture with an unterminated YAML collection.
        teardown: No external state is created.
        sourceRefs:
          - "#artifact/FIXTURE-INVALID-YAML"
      - id: FIX-UNKNOWN-FIELD
        name: unknown-node-field
        purpose: Provide a syntactically valid node with a forbidden property.
        setup: Load a fixture containing an undeclared node field.
        teardown: No external state is created.
        sourceRefs:
          - "#artifact/FIXTURE-UNKNOWN-FIELD"
    coverage:
      - id: COV-001
        requirementRefs:
          - REQ-001
        invariantRefs:
          - INV-001
        objectiveRefs:
          - OBJ-001
        testCaseRefs:
          - TC-001
        rationale: The unit test directly exercises the phase-one artifact contract.
      - id: COV-002
        requirementRefs:
          - REQ-001
          - REQ-002
        invariantRefs:
          - INV-001
        objectiveRefs:
          - OBJ-001
        testCaseRefs:
          - TC-002
          - TC-003
          - TC-004
          - TC-005
        rationale: The suite covers closed validation, resolution, injected execution, response mapping, and CLI boundaries.
    minimumRequiredTestCaseRefs:
      - TC-001
      - TC-002
      - TC-003
      - TC-004
      - TC-005
    recommendedTestCaseRefs: []
    evidenceLimitations:
      - The strategy defines tests but does not execute them or prove provider,
        deployment, or production behavior.

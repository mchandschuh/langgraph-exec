    elements:
      - id: E-001
        type: resolver
        name: trusted-component-resolver
        description: "Loads relative YAML components below a trusted root, verifies optional digests, assigns aliases, and rejects traversal, missing imports, duplicate aliases, and recursive import cycles."
        provenance:
          referenceRefs: []
          basis: "Composition requires deterministic fail-closed component loading before compilation."
          confidence: 96
      - id: E-002
        type: contract
        name: graph-artifact
        description: "A closed versioned graph YAML artifact declares imports, state fields, public ports, node instances, bindings, edges, conditional routes, and reducers."
        provenance:
          referenceRefs: []
          basis: "The graph contract is the minimum explicit topology and state boundary for phase two."
          confidence: 96
      - id: E-003
        type: state-model
        name: graph-state
        description: "A graph-owned state model validates declared paths, public input/output mappings, node writes, and reducer behavior for parallel updates."
        provenance:
          referenceRefs: []
          basis: "Explicit graph state prevents undeclared writes and makes reducer conflicts deterministic."
          confidence: 95
      - id: E-004
        type: validator
        name: dag-topology-validator
        description: "Validates node identifiers, bindings, reachability, START/END connectivity, conditional route cases, and acyclicity before backend lowering."
        provenance:
          referenceRefs: []
          basis: "Phase two accepts fixed and conditional DAGs but rejects arbitrary cycles and loop semantics."
          confidence: 98
      - id: E-005
        type: backend
        name: stategraph-lowering
        description: "Lowers normalized graph IR into LangGraph StateGraph nodes, START/END edges, conditional edges, and reducer-aware state channels."
        provenance:
          referenceRefs: []
          basis: "LangGraph StateGraph is the declared execution backend for phase-two composition."
          confidence: 92
      - id: E-006
        type: boundary
        name: nested-public-ports
        description: "Treats a nested graph as a component whose private state stays internal and whose parent interaction is limited to declared input/output ports."
        provenance:
          referenceRefs: []
          basis: "Nested composition requires explicit public-port mapping and bounded failure propagation."
          confidence: 96

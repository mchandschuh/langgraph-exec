  result:
    status: defined
    testCases:
      - id: TC-001
        title: Reject invalid event before persistence
        type: unit
        requirementLevel: required
        purpose: Prove the validation boundary for malformed input.
        procedure:
          executionMode: executable
          target: Validation service unit test
          steps:
            - Construct an invalid event fixture.
            - Invoke the validation service with a persistence spy.
            - Assert rejection and verify the persistence spy was not called.
          command: npm test -- --runInBand test/validation/service.test.ts
        expectedOutcome: The service rejects the event and persistence receives zero calls.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-001
        limitations:
          - This check does not prove behavior against a real persistence
            provider.
    fixtures:
      - id: FIX-001
        name: invalid-event
        purpose: Provide a stable malformed event for the negative path.
        setup: Create the event object with a missing required field and a persistence
          spy.
        teardown: Reset the spy after the test.
        sourceRefs:
          - "#artifact/FIXTURE-INVALID-EVENT"
    coverage:
      - id: COV-001
        requirementRefs:
          - REQ-001
        invariantRefs:
          - INV-001
        objectiveRefs:
          - OBJ-001
        testCaseRefs:
          - TC-001
        rationale: The unit test directly exercises rejection and the no-persistence
          side effect.
    minimumRequiredTestCaseRefs:

  intent:
    summary: "Define the deterministic unit-test strategy for WI-0003: Deliver
      release 0.3.0 with explicit bounded loops, compiler-enforced termination
      budgets, deterministic loop execution, and loop inspection."
    inputs:
      - id: INPUT-PHASE
        kind: constraint
        ref: "#constraint/PHASE"
        purpose: The phase contract and release boundary.
        required: true
    requirements:
      - id: REQ-001
        kind: requirement
        statement: "Valid loop declarations expose entry, body, exit, condition, counter, finite maxIterations, and exhaustion policy."
        inputRefs:
          - INPUT-PHASE
        required: true
      - id: REQ-002
        kind: requirement
        statement: "Undeclared cycles, missing exits/limits, bypass routes, and nested-bound violations fail closed."
        inputRefs:
          - INPUT-PHASE
        required: true
      - id: REQ-003
        kind: requirement
        statement: "Bounded loops support early exit, deterministic exhaustion, graph-wide maxSteps, and structured failure routing."
        inputRefs:
          - INPUT-PHASE
        required: true
      - id: REQ-004
        kind: requirement
        statement: "Phase-two nodes and nested graphs compose inside bounded loops without leaking private state."
        inputRefs:
          - INPUT-PHASE
        required: true
      - id: REQ-005
        kind: requirement
        statement: "Loop tests, inspection, build, link, and prior regression tests pass for the phase release."
        inputRefs:
          - INPUT-PHASE
        required: true
    invariants:
      - id: INV-001
        statement: Tests use fake components and do not require live providers.
        inputRefs:
          - INPUT-PHASE
        required: true
      - id: INV-002
        statement: Every loop and graph execution path has a finite compiler-enforced work budget.
        inputRefs:
          - INPUT-PHASE
        required: true
    objectives:
      - id: OBJ-001
        statement: Verify loop contract validation and safety failures.
        inputRefs:
          - INPUT-PHASE
        requirementRefs:
          - REQ-001
          - REQ-002
        invariantRefs:
          - INV-001
          - INV-002
      - id: OBJ-002
        statement: Verify bounded execution outcomes, counters, nested bodies, and failure routing.
        inputRefs:
          - INPUT-PHASE
        requirementRefs:
          - REQ-003
          - REQ-004
        invariantRefs:
          - INV-001
          - INV-002
      - id: OBJ-003
        statement: Verify regression, inspection, and local release behavior.
        inputRefs:
          - INPUT-PHASE
        requirementRefs:
          - REQ-005
        invariantRefs:
          - INV-001
    nonGoals:
      - Do not claim provider or production behavior from local unit tests.
  result:
    status: defined
    testCases:
      - id: TC-001
        title: Validate explicit loop contracts and effective bounds
        type: unit
        requirementLevel: required
        purpose: Prove valid loop declarations expose effective limits and malformed loop definitions fail before compilation.
        procedure:
          executionMode: executable
          target: Loop contract validator
          steps:
            - Parse a valid loop with entry, body, exit, condition, counter, maxIterations, maxSteps, and exhaustion policy.
            - Parse fixtures missing exits, missing finite limits, invalid conditions, and invalid policies.
            - Assert valid effective bounds and fail-closed errors.
          command: yarn test
        expectedOutcome: Valid loops normalize with finite limits and invalid loops fail before backend compilation.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-VALID-LOOP
          - FIX-INVALID-LOOP
        limitations:
          - This check does not prove runtime provider behavior.
      - id: TC-002
        title: Reject arbitrary cycles and budget bypass routes
        type: unit
        requirementLevel: required
        purpose: Prove that only declared loop transitions may cycle and all paths remain within finite budgets.
        procedure:
          executionMode: executable
          target: Loop safety validator
          steps:
            - Load an undeclared cycle fixture and assert rejection.
            - Load a loop with a bypass route around the counter/budget and assert rejection.
            - Load nested loops whose effective limits exceed the parent budget and assert rejection.
          command: yarn test
        expectedOutcome: Unsafe cycles and budget bypasses fail closed.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-ARBITRARY-CYCLE
          - FIX-BYPASS-ROUTE
          - FIX-NESTED-BOUNDS
        limitations:
          - This check does not prove backend behavior.
      - id: TC-003
        title: Execute early-exit and exhausted loops deterministically
        type: component
        requirementLevel: required
        purpose: Prove graph-owned counters, early condition exit, maxIterations exhaustion, and structured terminal status.
        procedure:
          executionMode: executable
          target: Bounded loop backend
          steps:
            - Execute a loop whose fake condition becomes true on the second iteration.
            - Assert the counter and terminal status are deterministic.
            - Execute a loop whose condition never becomes true and assert structured exhaustion at maxIterations.
          command: yarn test
        expectedOutcome: Early exit succeeds with the observed counter; exhaustion returns a bounded loop-limit result.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: component
        fixtureRefs:
          - FIX-EARLY-EXIT
          - FIX-EXHAUSTION
        limitations:
          - This check uses fake loop-body components.
      - id: TC-004
        title: Enforce graph step budgets and nested loop bounds
        type: component
        requirementLevel: required
        purpose: Prove maxSteps enforcement, nested bound multiplication, and parent-owned termination.
        procedure:
          executionMode: executable
          target: Bounded loop backend
          steps:
            - Execute a loop whose iteration budget exceeds maxSteps.
            - Execute a nested loop body and assert the effective nested budget is enforced.
            - Assert the terminal result identifies step-budget exhaustion separately from iteration exhaustion.
          command: yarn test
        expectedOutcome: No loop path exceeds graph-owned work budgets.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: component
        fixtureRefs:
          - FIX-STEP-BUDGET
          - FIX-NESTED-LOOP
        limitations:
          - This check does not claim checkpoint/resume behavior.
      - id: TC-005
        title: Propagate loop-body failures and preserve phase-two composition
        type: component
        requirementLevel: required
        purpose: Prove failure routing, nested graph loop bodies, and private-state isolation.
        procedure:
          executionMode: executable
          target: Loop body composition
          steps:
            - Execute a loop body that returns a structured failure.
            - Execute a loop whose body is a nested graph with public ports.
            - Assert failure does not silently re-enter and nested private state remains hidden.
          command: yarn test
        expectedOutcome: Failures terminate through the declared policy and nested loop bodies compose through public ports.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: component
        fixtureRefs:
          - FIX-FAILURE
          - FIX-NESTED-LOOP
        limitations:
          - This check does not prove durable side-effect recovery.
      - id: TC-006
        title: Inspect loops and run full regression/release behavior
        type: unit
        requirementLevel: required
        purpose: Prove provider-free loop inspection plus all earlier regressions and local release commands.
        procedure:
          executionMode: executable
          target: Repository regression and CLI suite
          steps:
            - Run all phase-one, phase-two, and phase-three tests.
            - Inspect a loop graph and assert effective limits/counter metadata.
            - Build and link the package through the user-local prefix.
          command: yarn test
        expectedOutcome: All regression/loop tests and provider-free inspection pass.
        passCriteria: The test process exits zero and all assertions pass.
        evidenceTier: unit
        fixtureRefs:
          - FIX-VALID-LOOP
        limitations:
          - This check does not prove live provider or production behavior.
    fixtures:
      - id: FIX-VALID-LOOP
        name: valid-bounded-loop
        purpose: Provide a complete finite loop with entry, body, exit, condition, counter, maxIterations, maxSteps, and exhaustion policy.
        setup: Load a repository-local loop graph fixture.

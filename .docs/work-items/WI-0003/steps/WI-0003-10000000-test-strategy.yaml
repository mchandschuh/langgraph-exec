          - "#artifact/FIXTURE-NESTED-BOUNDS"
      - id: FIX-EARLY-EXIT
        name: early-exit
        purpose: Provide a loop body whose condition becomes true before the iteration limit.
        setup: Load a deterministic fake-body loop fixture.
        teardown: No external state is created.
        sourceRefs:
          - "#artifact/FIXTURE-EARLY-EXIT"
      - id: FIX-EXHAUSTION
        name: exhaustion
        purpose: Provide a loop whose condition never becomes true.
        setup: Load a deterministic exhaustion fixture.
        teardown: No external state is created.
        sourceRefs:
          - "#artifact/FIXTURE-EXHAUSTION"
      - id: FIX-STEP-BUDGET
        name: step-budget
        purpose: Provide a loop that exceeds graph maxSteps before maxIterations.
        setup: Load a finite step-budget fixture.
        teardown: No external state is created.
        sourceRefs:
          - "#artifact/FIXTURE-STEP-BUDGET"
      - id: FIX-NESTED-LOOP
        name: nested-loop
        purpose: Provide a nested graph loop body with public ports.
        setup: Load a nested loop-body fixture.
        teardown: No external state is created.
        sourceRefs:
          - "#artifact/FIXTURE-NESTED-LOOP"
      - id: FIX-FAILURE
        name: loop-failure
        purpose: Provide a loop body that returns a structured failure.
        setup: Load a deterministic failure-routing fixture.
        teardown: No external state is created.
        sourceRefs:
          - "#artifact/FIXTURE-FAILURE"

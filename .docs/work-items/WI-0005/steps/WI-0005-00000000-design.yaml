  intent:
    summary: Define how the YAML compiler remains application-specific while LangGraph owns graph scheduling, state transitions, native control flow, operational policies, and runtime observability.
    objectives:
      - Allocate responsibilities between the YAML compiler, provider boundary, and LangGraph runtime.
      - Define compatibility rules for loop budgets, branch limits, response-status retries, timeouts, nested components, and debug output.
      - Define a runtime API boundary that preserves invoke behavior and leaves a safe extension point for future stream and checkpointer support.
    inScope:
      - StateGraph lowering for loops, routes, static fan-out/fan-in, and dynamic map work.
      - LangGraph retryPolicy, timeout, reducers, Send, stream modes, and task/debug events.
      - Public-port behavior, nested-component isolation, bounded semantic budgets, and migration tests.
    outOfScope:
      - Checkpoint persistence, interrupt/resume, human approval, durable side-effect receipts, live providers, and deployment.
    policy:
      id: component-design
      version: "1"
    profile: implementable
    scope: component
    facets:
      - structure
      - contract
      - behavior

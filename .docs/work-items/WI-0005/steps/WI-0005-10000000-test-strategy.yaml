  required:
    - .docs/work-items/WI-0005/work-item.json
    - .docs/work-items/WI-0005/README.md
    - .docs/work-items/WI-0005/steps/WI-0005-00000000-design.yaml
    - package.json
    - src/graph.ts
    - src/loop.ts
    - src/controls.ts
    - tests/graph.test.ts
    - tests/loop.test.ts
    - tests/control.test.ts
  informational:
    - node_modules/@langchain/langgraph/dist/graph/state.d.ts
    - node_modules/@langchain/langgraph/dist/pregel/utils/index.d.ts

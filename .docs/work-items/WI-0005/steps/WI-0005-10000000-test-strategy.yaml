  schema: https://schemas.handschuh.dev/sdlc/task-governance/v1
  ownedPaths:
    - .docs/work-items/WI-0005/
  commitSubject: "WI-0005: 02: define built-in alignment test strategy"
  commitBody:
    requiredSections:
      - Why
      - What
      - Validation
      - Evidence
      - Next
  validationProcedures:
    - id: diff-check
      executable: git
      arguments:
        - diff

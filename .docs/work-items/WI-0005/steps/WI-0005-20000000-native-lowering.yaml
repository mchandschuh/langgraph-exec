task:
  status: complete
  taskSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1#/properties/result
  intent:
    summary: Lower validated YAML control flow into StateGraph cycles, edges,
      conditional edges, Send fan-out, and reducer channels instead of executing
      a second manual orchestration runtime.
    changeTypes:
      - production-code
      - test-code
      - schema
      - documentation
    changeIntent: refactor
    inputs:
      - id: INPUT-WORK-ITEM
        kind: constraint
        ref: sdlc://repo/local%2Fgithub%2Flanggraph-exec/WI-0005#work-item.json%23requirement/WI-0005_REQ_002
        purpose: Native graph control-flow requirement.
        required: true
      - id: INPUT-DESIGN
        kind: design
        ref: WI-0005|00000000#outcome/O-001
        purpose: Responsibility allocation and compatibility design.
        required: true
      - id: INPUT-TEST-STRATEGY
        kind: task
        ref: WI-0005|10000000#result/R-001
        purpose: Required test cases for native lowering.
        required: true
    objectives:
      - id: OBJ-001
        statement: Compile bounded loops into StateGraph conditional cycles with
          explicit semantic counters, maxSteps accounting, exhaustion routes,
          and recursion safety.
        inputRefs:
          - INPUT-WORK-ITEM
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-002
      - id: OBJ-002
        statement: Compile static parallel branches and joins into graph edges and
          reducer channels while retaining branch limits and replace-conflict
          validation.
        inputRefs:
          - INPUT-WORK-ITEM
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-003
      - id: OBJ-003
        statement: Compile dynamic map work into bounded Send fan-out and reducer-based
          aggregation while preserving explicit item limits and public result
          ordering.
        inputRefs:
          - INPUT-WORK-ITEM
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-004
      - id: OBJ-004
        statement: Use addConditionalEdges for switch routing and preserve nested
          public-port isolation without a second runtime route evaluator.
        inputRefs:
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-001
          - WI-0005|10000000#test-case/TC-003
    ownedPaths:
      - src/graph.ts
      - src/loop.ts
      - src/controls.ts
      - src/index.ts
      - tests/graph.test.ts
      - tests/loop.test.ts
      - tests/control.test.ts
      - tests/fixtures/graphs/
      - tests/fixtures/loops/
    nonGoals:
      - Do not remove YAML validation, trusted imports, public ports, nested
        state isolation, or provider boundaries.
      - Do not implement checkpoint persistence, interrupt/resume, or durable
        side-effect recovery.
      - Do not allow unbounded Send expansion or arbitrary YAML executable code.
    steps:
      - Extend normalized graph IR and compiler-generated state channels for
        semantic loop counters, step budgets, branch results, map results, and
        route state.
      - Replace the manual loop invoke path with a compiled StateGraph cycle and
        conditional exit/re-entry transitions.
      - Lower static parallel branches and joins to graph edges and reducers;
        lower dynamic map expansion to bounded Send work.
      - Keep control helpers only for compiler validation, result-envelope
        adaptation, or semantics not represented by LangGraph, and remove
        duplicate runtime scheduling.
      - Update fixtures, tests, inspection output, and documentation for the
        native execution path.
  result:
    status: implemented
    implementation:
      summary: Replaced the bounded loop while-runner with a LangGraph StateGraph
        cycle, added static StateGraph fan-out/fan-in reducer coverage, and
        preserved semantic budgets and public result envelopes.
      changes:
        - id: CHANGE-001
          type: production-code
          summary: Lower bounded control.loop execution into a StateGraph body cycle with
            conditional exit/re-entry routing, graph-owned counters, recursion
            safety, and preserved LoopResult statuses.
          objectiveRefs:
            - OBJ-001
          paths:
            - src/loop.ts
        - id: CHANGE-002
          type: production-code
          summary: Preserve static graph scheduling through StateGraph edges and reducer
            channels, including native retry/timeout node policy options.
          objectiveRefs:
            - OBJ-002
            - OBJ-004
          paths:
            - src/graph.ts
            - schemas/graph/v1/graph.schema.json
        - id: CHANGE-003
          type: test-code
          summary: Add deterministic StateGraph loop, stream, retry, timeout, and static
            parallel fan-out/fan-in tests.
          objectiveRefs:
            - OBJ-001
            - OBJ-002
            - OBJ-004
          paths:
            - tests/loop.test.ts
            - tests/graph.test.ts
            - tests/fixtures/graphs/parallel-dag.yml
            - tests/fixtures/graphs/timeout-dag.yml
      testImplementations:
        - testCaseRef: WI-0005|10000000#test-case/TC-002
          path: tests/loop.test.ts
          selector: valid loop exits early with deterministic counters
        - testCaseRef: WI-0005|10000000#test-case/TC-003
          path: tests/graph.test.ts
          selector: static parallel branches use LangGraph supersteps and reducers
        - testCaseRef: WI-0005|10000000#test-case/TC-005
          path: tests/graph.test.ts
          selector: graph node retryPolicy is executed by LangGraph for operational
            failures
        - testCaseRef: WI-0005|10000000#test-case/TC-006
          path: tests/graph.test.ts
          selector: compiled graphs expose LangGraph stream updates and preserve actual
            node event values
    verification:
      status: passed
      objectiveRefs:
        - OBJ-001
        - OBJ-002
        - OBJ-004
      tests:
        - id: EXEC-001
          type: component
          testCaseRefs:
            - WI-0005|10000000#test-case/TC-002
            - WI-0005|10000000#test-case/TC-003
            - WI-0005|10000000#test-case/TC-005
            - WI-0005|10000000#test-case/TC-006
          status: passed
          result: yarn build && yarn test passed 48 provider-free tests, including
            StateGraph loop, static fan-out/fan-in, native retry/timeout, stream
            updates, and actual node event values.
        - id: EXEC-002
          type: static
          testCaseRefs:
            - WI-0005|10000000#test-case/TC-002
            - WI-0005|10000000#test-case/TC-003
          status: passed
          result: yarn typecheck passed and graph/loop schema fixtures validated.
    limitations:
      - Dynamic Send/map lowering is not implemented because the current YAML
        graph contract has no dynamic collection/map document form; the existing
        standalone control.map helper remains outside compiled graph scheduling.
      - This implementation does not add checkpoint persistence,
        interrupt/resume, durable side-effect recovery, or production evidence.

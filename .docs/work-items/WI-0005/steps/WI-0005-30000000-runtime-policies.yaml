        purpose: Required policy and observability tests.
        required: true
    objectives:
      - id: OBJ-001
        statement: Map operational retry configuration to LangGraph RetryPolicy with finite attempts, retryOn classification, backoff, and bounded failure adaptation.
        inputRefs:
          - INPUT-WORK-ITEM
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-005
      - id: OBJ-002
        statement: Map node and task timeout configuration to LangGraph timeout facilities without allowing late results to update graph state.
        inputRefs:
          - INPUT-WORK-ITEM
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-005
      - id: OBJ-003
        statement: Distinguish thrown operational node failures from structured llm response failures and preserve provider-specific retry semantics at the provider boundary.
        inputRefs:
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-005
      - id: OBJ-004
        statement: Replace precomputed/final-state debug projection with actual LangGraph updates, debug, tasks, and custom public-port events.
        inputRefs:
          - INPUT-OBSERVABILITY
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-006
    ownedPaths:
      - src/graph.ts
      - src/node.ts
      - src/controls.ts
      - src/cli/main.ts
      - src/index.ts
      - tests/node.test.ts
      - tests/graph.test.ts

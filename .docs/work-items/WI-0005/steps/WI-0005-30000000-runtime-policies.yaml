task:
  status: complete
  taskSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1
  intentSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1#/properties/intent
  resultSchema: https://schemas.handschuh.dev/sdlc/task-implementation/v1#/properties/result
  intent:
    summary: Configure LangGraph retryPolicy and timeout for operational node
      failures, preserve provider-specific structured response handling, and
      expose accurate runtime stream/debug/task events through the compiled
      runtime boundary.
    changeTypes:
      - production-code
      - test-code
      - configuration
      - documentation
    changeIntent: refactor
    inputs:
      - id: INPUT-WORK-ITEM
        kind: constraint
        ref: sdlc://repo/local%2Fgithub%2Flanggraph-exec/WI-0005#work-item.json%23requirement/WI-0005_REQ_003
        purpose: Native operational-policy requirement.
        required: true
      - id: INPUT-OBSERVABILITY
        kind: constraint
        ref: sdlc://repo/local%2Fgithub%2Flanggraph-exec/WI-0005#work-item.json%23requirement/WI-0005_REQ_004
        purpose: Accurate runtime-observability requirement.
        required: true
      - id: INPUT-DESIGN
        kind: design
        ref: WI-0005|00000000#outcome/O-001
        purpose: Failure-boundary and runtime-adapter design.
        required: true
      - id: INPUT-TEST-STRATEGY
        kind: task
        ref: WI-0005|10000000#result/R-001
        purpose: Required policy and observability tests.
        required: true
    objectives:
      - id: OBJ-001
        statement: Map operational retry configuration to LangGraph RetryPolicy with
          finite attempts, retryOn classification, backoff, and bounded failure
          adaptation.
        inputRefs:
          - INPUT-WORK-ITEM
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-005
      - id: OBJ-002
        statement: Map node and task timeout configuration to LangGraph timeout
          facilities without allowing late results to update graph state.
        inputRefs:
          - INPUT-WORK-ITEM
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-005
      - id: OBJ-003
        statement: Distinguish thrown operational node failures from structured llm
          response failures and preserve provider-specific retry semantics at
          the provider boundary.
        inputRefs:
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-005
      - id: OBJ-004
        statement: Replace precomputed/final-state debug projection with actual
          LangGraph updates, debug, tasks, and custom public-port events.
        inputRefs:
          - INPUT-OBSERVABILITY
          - INPUT-DESIGN
          - INPUT-TEST-STRATEGY
        testCaseRefs:
          - WI-0005|10000000#test-case/TC-006
    ownedPaths:
      - src/graph.ts
      - src/node.ts
      - src/controls.ts
      - src/cli/main.ts
      - src/index.ts
      - tests/node.test.ts
      - tests/graph.test.ts
      - tests/control.test.ts
      - samples/two-llm-conversation/
      - README.md
      - SKILL.md
    nonGoals:
      - Do not retry every structured provider response with LangGraph unless
        the response is deliberately converted to a typed retryable node
        failure.
      - Do not silently swallow LangGraph interrupt or control-flow exceptions.
      - Do not add checkpointers, persistence, interrupt/resume, or production
        tracing backends.
    steps:
      - Add normalized retry and timeout policy fields only where the YAML
        contract needs them, with explicit defaults and finite bounds.
      - Compile operational policies into StateGraph.addNode options and adapt
        native errors at the public result boundary.
      - Preserve provider response validation and provider-specific retry
        behavior in node/llm code.
      - Forward supported stream modes and runtime options through a documented
        compiled-runtime API without enabling unsupported persistence claims.
      - Emit or derive public-port diagnostics from actual node execution events
        and add regression coverage for upstream/downstream values.
  result:
    status: implemented
    implementation:
      summary: Compiled serializable retryPolicy and timeout fields into StateGraph
        nodes, exposed bounded stream updates, and moved graph node diagnostics
        into actual node execution updates.
      changes:
        - id: CHANGE-001
          type: production-code
          summary: Add graph node retryPolicy and timeout configuration and pass them to
            StateGraph.addNode.
          objectiveRefs:
            - OBJ-001
            - OBJ-002
          paths:
            - src/graph.ts
            - schemas/graph/v1/graph.schema.json
        - id: CHANGE-002
          type: production-code
          summary: Expose CompiledGraph.stream using LangGraph stream modes without
            enabling checkpoint persistence.
          objectiveRefs:
            - OBJ-004
          paths:
            - src/graph.ts
            - src/index.ts
        - id: CHANGE-003
          type: test-code
          summary: Prove native retry, timeout, stream update, and actual
            upstream/downstream debug values.
          objectiveRefs:
            - OBJ-001
            - OBJ-002
            - OBJ-004
          paths:
            - tests/graph.test.ts
      testImplementations:
        - testCaseRef: WI-0005|10000000#test-case/TC-005
          path: tests/graph.test.ts
          selector: graph timeout uses LangGraph native timeout policy
        - testCaseRef: WI-0005|10000000#test-case/TC-006
          path: tests/graph.test.ts
          selector: compiled graphs expose LangGraph stream updates and preserve actual
            node event values
    verification:
      status: passed
      objectiveRefs:
        - OBJ-001
        - OBJ-002
        - OBJ-003
        - OBJ-004
      tests:
        - id: EXEC-001
          type: component
          testCaseRefs:
            - WI-0005|10000000#test-case/TC-005
            - WI-0005|10000000#test-case/TC-006
          status: passed
          result: Native retryPolicy and timeout tests passed; stream updates and actual
            upstream/downstream graph diagnostics passed.
        - id: EXEC-002
          type: static
          testCaseRefs:
            - WI-0005|10000000#test-case/TC-005
          status: passed
          result: Graph schema and TypeScript build passed with serializable retry/timeout
            policy fields.
    limitations:
      - Provider-specific structured response retry remains owned by the llm
        package and is not converted into LangGraph operational retry.
      - Standalone control.retry and control.timeout remain public
        semantic/result-envelope helpers; compiled graph nodes use native
        LangGraph policies.
      - No checkpoint persistence, interrupt/resume, durable side-effect, live
        provider, or production tracing evidence is claimed.

      - samples/two-llm-conversation/
      - README.md
      - SKILL.md
    nonGoals:
      - Do not retry every structured provider response with LangGraph unless the response is deliberately converted to a typed retryable node failure.
      - Do not silently swallow LangGraph interrupt or control-flow exceptions.
      - Do not add checkpointers, persistence, interrupt/resume, or production tracing backends.
    steps:
      - Add normalized retry and timeout policy fields only where the YAML contract needs them, with explicit defaults and finite bounds.
      - Compile operational policies into StateGraph.addNode options and adapt native errors at the public result boundary.
      - Preserve provider response validation and provider-specific retry behavior in node/llm code.
      - Forward supported stream modes and runtime options through a documented compiled-runtime API without enabling unsupported persistence claims.
      - Emit or derive public-port diagnostics from actual node execution events and add regression coverage for upstream/downstream values.

  intent:
    summary: Configure LangGraph retryPolicy and timeout for operational node failures, preserve provider-specific structured response handling, and expose accurate runtime stream/debug/task events through the compiled runtime boundary.
    changeTypes:
      - production-code
      - test-code
      - configuration
      - documentation

      - Define the generic component-to-LangGraph adapter contract.
      - Define how loop budgets, failure routes, retry, timeout, streaming, and public ports map to LangGraph.
      - Define the controls.ts removal and conversation-sample migration plan.
    inScope:
      - StateGraph lowering and one compiled runtime boundary.
      - Generic component input/output adaptation.
      - Native retryPolicy, timeout, routes, reducers, cycles, streams, and supported Send lowering.
      - README and sample architecture documentation.
    outOfScope:
      - Checkpoint persistence, interrupt/resume, human approval, durable side-effect recovery, live providers, and deployment.

    testCases:
      - id: TC-001
        title: Generic component adapter updates LangGraph state
        type: component
        requirementLevel: required
        purpose: Prove port inputs/outputs are adapted once and executed as a LangGraph node.
        command: yarn test
        expectedOutcome: The adapted component receives declared inputs and returns a validated partial state update.
        passCriteria: Adapter tests pass with fake components and no manual graph traversal.
        evidenceTier: component
      - id: TC-002
        title: Bounded loop uses StateGraph cycle
        type: component
        requirementLevel: required
        purpose: Preserve early exit, exhaustion, and semantic counters through native graph transitions.
        command: yarn test
        expectedOutcome: Loop cases pass through the unified compiled runtime.
        passCriteria: No separate CompiledLoop execution path is required.
        evidenceTier: component
      - id: TC-003
        title: Native route, reducer, retry, timeout, and stream behavior
        type: component
        requirementLevel: required
        purpose: Exercise LangGraph primitives directly through the public compiled runtime.
        command: yarn test
        expectedOutcome: Native policy and stream assertions pass.
        passCriteria: Tests identify actual runtime updates and no helper executor.
        evidenceTier: component
      - id: TC-004
        title: Conversation sample uses declarative graph execution
        type: component
        requirementLevel: required
        purpose: Preserve bounded participant ordering, retries, and failure records.
        command: yarn test
        expectedOutcome: Sample test passes with injected completion service.
        passCriteria: Sample has no controls.ts import or manual retry/try calls.
        evidenceTier: component
      - id: TC-005
        title: Compiler and trust-boundary regression suite
        type: component
        requirementLevel: required
        purpose: Preserve schemas, imports, digests, nested ports, and provider boundaries while changing runtime ownership.
        command: yarn test
        expectedOutcome: Existing graph/node/schema regressions pass.
        passCriteria: Existing coverage remains green or has explicit migration tests.
        evidenceTier: component
      - id: TC-006
        title: Static duplicate-runtime audit
        type: inspection
        requirementLevel: required
        purpose: Prove the deleted helper module and equivalent manual graph runtime are absent.
        command: git diff --check
        expectedOutcome: No stale imports or duplicate execution patterns remain.
        passCriteria: Targeted searches show no controls.ts dependency and no graph execution Promise.all/Promise.race/manual retry path.
        evidenceTier: inspection
      - id: TC-007
        title: CLI and documentation gate
        type: cli
        requirementLevel: required
        purpose: Prove validate, inspect, run, samples, and README guidance agree.
        command: yarn typecheck && yarn test && yarn build
        expectedOutcome: CLI and documentation checks pass.
        passCriteria: Provider-free CLI validation/inspection and documentation assertions pass.
        evidenceTier: cli-audit
    nonGoals:

schema: https://schemas.handschuh.dev/langgraph-exec/graph/v1
kind: graph
name: sample-child-completion
imports:
  - path: direct-completion.yml
    alias: direct
state:
  fields:
    task:
      type: string
      reducer: replace
    result:
      type: object
      reducer: replace
ports:
  inputs:
    task:
      state: task
      type: string
      required: true
  outputs:
    result:
      state: result
      type: object
      required: true
nodes:
  - id: complete
    component: direct
bindings:
  - from: input.task
    to: node.complete.task
  - from: node.complete.response
    to: output.result
edges:
  - from: __start__
    to: complete
  - from: complete
    to: __end__
routes: []
schema: https://schemas.handschuh.dev/langgraph-exec/graph/v1
kind: graph
name: sample-nested-answer
imports:
  - path: child.yml
    alias: answer
state:
  fields:
    task:
      type: string
      reducer: replace
    result:
      type: object
      reducer: replace
ports:
  inputs:
    task:
      state: task
      type: string
      required: true
  outputs:
    result:
      state: result
      type: object
      required: true
nodes:
  - id: nested
    component: answer
bindings:
  - from: input.task
    to: node.nested.task
  - from: node.nested.result
    to: output.result
edges:
  - from: __start__
    to: nested
  - from: nested
    to: __end__
routes: []
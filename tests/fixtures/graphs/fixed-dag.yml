schema: https://schemas.handschuh.dev/langgraph-exec/graph/v1
kind: graph
name: fixed-dag
imports: []
state:
  fields:
    message:
      type: string
      reducer: replace
    result:
      type: string
      reducer: replace
ports:
  inputs:
    message:
      state: message
      type: string
      required: true
  outputs:
    result:
      state: result
      type: string
      required: true
nodes:
  - id: first
    component: fake.first
    retryPolicy:
      maxAttempts: 2
      jitter: false
    timeout: 5000
  - id: second
    component: fake.second
bindings:
  - from: input.message
    to: node.first.in
  - from: node.first.out
    to: node.second.in
  - from: node.second.out
    to: output.result
edges:
  - from: __start__
    to: first
  - from: first
    to: second
  - from: second
    to: __end__
routes: []
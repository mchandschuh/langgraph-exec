schema: https://schemas.handschuh.dev/langgraph-exec/graph/v1
kind: graph
name: import-traversal
imports:
  - path: ../valid-node.yaml
    alias: unsafe
state:
  fields:
    result:
      type: string
      reducer: replace
ports:
  inputs: {}
  outputs:
    result:
      state: result
      type: string
nodes:
  - id: call
    component: unsafe
bindings: []
edges:
  - from: __start__
    to: call
  - from: call
    to: __end__
routes: []
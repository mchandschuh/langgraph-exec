schema: https://schemas.handschuh.dev/langgraph-exec/node/v1
kind: node
name: direct-completion
implementation: llm.complete
parameters:
  provider:
    type: string
    default: openrouter
  model:
    type: string
    default: openai/gpt-5.6-luna
  thinking:
    type: string
    default: high
  maxFailedAttempts:
    type: integer
    default: 3
  maxIterations:
    type: integer
    default: 2
  requestSchema:
    type: string
    default: https://schemas.handschuh.dev/llm/request/v1
  responseSchema:
    type: string
    default: https://schemas.handschuh.dev/llm/response/v1
  systemPrompt:
    type: string
    default: Return a concise answer.
ports:
  inputs:
    task:
      type: string
      required: true
  outputs:
    response:
      type: object
      required: true
bindings:
  provider: parameter.provider
  model: parameter.model
  thinking: parameter.thinking
  maxFailedAttempts: parameter.maxFailedAttempts
  maxIterations: parameter.maxIterations
  task: input.task
  systemPrompt: parameter.systemPrompt
contracts:
  input:
    oneOf:
      - $ref: https://schemas.handschuh.dev/llm/request/v1
      - $ref: https://schemas.handschuh.dev/llm/request/v2
  output:
    oneOf:
      - $ref: https://schemas.handschuh.dev/llm/response/v1
      - $ref: https://schemas.handschuh.dev/llm/response/v2
